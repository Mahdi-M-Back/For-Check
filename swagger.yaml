openapi: 3.1.0

info:
  title: Node.js REST API
  version: 1.0.0
  description: RESTful API documentation built with Express.js and MongoDB.

servers:
  - url: http://localhost:3000
    description: Development Server

tags:
  - name: Users
    description: User authentication and profile management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:

#User
  /api/v1/users/signup:
    post:
      summary: Register new user
      description: Create a new user account.
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - userName
                - password
              properties:
                name:
                  type: string
                  example: 'Mahdi Moshtaghi'

                email:
                  type: string
                  format: email
                  example: 'mahdi@example.com'

                userName:
                  type: string
                  example: 'mahdi123'

                password:
                  type: string
                  format: password
                  example: 'Password123'

      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  token:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9'

                  data:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: '6878f1d94fd5c7ec58a12345'

                      name:
                        type: string
                        example: 'Mahdi Moshtaghi'

                      email:
                        type: string
                        example: 'mahdi@example.com'

                      userName:
                        type: string
                        example: 'mahdi123'

                      role:
                        type: string
                        example: 'user'

        '401':
          description: Email already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  en_message:
                    type: string
                    example: 'This email used by another user.'

  /api/v1/users/login:
    post:
      summary: Login user
      description: Authenticate user and return JWT token.
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'mahdi@example.com'

                password:
                  type: string
                  format: password
                  example: 'Password123'

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  token:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9'

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  en_message:
                    type: string
                    example: 'Incorrect email or password'

  /api/v1/users/forgotPassword:
    post:
      summary: Send password reset token
      description: Send password reset link to user email.
      tags:
        - Users

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "mahdi@example.com"

      responses:
        '200':
          description: Reset token sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  en_message:
                    type: string
                    example: "Token sent to email.!"

        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  en_message:
                    type: string
                    example: "If this email exists, a reset link was sent."

  /api/v1/users/resetPassword/{token}:
    patch:
      summary: Reset password
      description: Reset password using reset token.
      tags:
        - Users

      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
          example: "2e1dd03fa2d4c7e50d7f46d9"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  example: "NewPassword123"

      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"

        '404':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false

                  en_message:
                    type: string
                    example: "Somethings went very wrong.!"            

  /api/v1/users/updatePassword:
    patch:
      summary: Update password
      description: Change current user password.
      tags:
        - Users

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  example: "NewPassword123"

      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  en_message:
                    type: string
                    example: "Password reset successfully."